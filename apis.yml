aid: nomad-health
name: Nomad Health
description: 'Nomad Health operates a digital marketplace for healthcare travel staffing,
  connecting travel nurses, allied health professionals and other clinicians directly
  with healthcare facilities across all fifty U.S. states. The two-sided platform lets
  clinicians search and apply for travel assignments with transparency on pay rate,
  shift structure and requirements, while facilities post open positions and manage
  hiring through a cloud-based system; Nomad Navigators support clinicians through
  credentialing, onboarding and on-assignment needs. Nomad Health holds the Joint
  Commission Gold Seal of Approval for Travel Nursing Accreditation and reports more
  than 400,000 registered clinicians across 50-plus specialties spanning nursing,
  cath lab, laboratory, occupational therapy, physical therapy, radiology, respiratory
  therapy, sonography, speech language pathology and surgical technology. The company
  runs no public developer program, but serves a live Swagger 2.0 contract and a
  Swagger UI from its production application host covering job search, applications,
  credentialing, placements, facilities and messaging.'
